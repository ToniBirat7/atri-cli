[pytest]
# Pytest configuration for orchestrator tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    integration: Integration tests requiring full stack
    unit: Unit tests for individual components
    async: Asynchronous tests
    slow: Slow tests (network, I/O heavy)
    gpu: GPU-specific tests
    native_parsing: Native Gemma 4 tool-call parsing tests
    openai_parsing: OpenAI format tool-call parsing tests

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_scope = function

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Timeout for async tests (30 seconds)
timeout = 30
