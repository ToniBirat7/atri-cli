services:
  postgres:
    image: postgres:16-alpine
    container_name: atri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atri
      POSTGRES_USER: atri
      POSTGRES_PASSWORD: atri
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atri -d atri']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atri-network

  redis:
    image: redis:7-alpine
    container_name: atri-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atri-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: atri-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'
    networks:
      - atri-network

  llama:
    build:
      context: ./runtime/llm/llama.cpp
      dockerfile: Dockerfile
    container_name: atri-llama
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      LLAMA_ARG_MODEL: /models/gemma-4-e2b-it-Q4_K_M.gguf
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: '8000'
      LLAMA_ARG_API_KEY: ${LLAMA_API_KEY:-__SET_ME__}
      LLAMA_ARG_JINJA: 'true'
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - atri-network

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: atri-orchestrator
    restart: unless-stopped
    ports:
      - '8001:8001'
    volumes:
      - '${PWD}:${PWD}'
      - './services/mcp:/app/services/mcp:ro'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llama:
        condition: service_healthy
    environment:
      LLM_BASE_URL: http://llama:8000/v1
      LLM_API_KEY: ${LLAMA_API_KEY:-__SET_ME__}
      LLM_MODEL: local-model
      LLM_TEMPERATURE: '0.7'
      LLM_MAX_TOKENS: '2048'
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-__SET_ME__}
      MCP_TOOL_TIMEOUT_SECONDS: '10'
      AGENT_MAX_TURNS: '10'
      AGENT_MAX_TOOL_CALLS_PER_TURN: '3'
      LOG_LEVEL: INFO
      ENABLE_OBSERVABILITY: 'true'
      ORCHESTRATOR_DATABASE_URL: postgresql://atri:atri@postgres:5432/atri
      ORCHESTRATOR_ENABLE_PERSISTENCE: 'true'
      ORCHESTRATOR_AUTH_MODE: hybrid
      ORCHESTRATOR_JWT_SECRET: ${ORCHESTRATOR_JWT_SECRET:-replace-with-a-long-random-secret}
      ORCHESTRATOR_JWT_ISSUER: atri-code
      ORCHESTRATOR_JWT_AUDIENCE: atri-code-orchestrator
      ORCHESTRATOR_SERVICE_SUBJECT: orchestrator-service
      ORCHESTRATOR_REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_REDIS_ENABLED: 'true'
      ORCHESTRATOR_RATE_LIMIT_PER_MINUTE: '60'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_SERVICE_NAME: atri-orchestrator
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - atri-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: atri-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - '${PWD}:${PWD}'
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://orchestrator:8001
      ORCHESTRATOR_URL: http://orchestrator:8001
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-__SET_ME__}
      NEXT_PUBLIC_DEFAULT_ALLOWED_DIRECTORY: ${PWD}
      NODE_ENV: production
    networks:
      - atri-network

networks:
  atri-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  tempo-data:
