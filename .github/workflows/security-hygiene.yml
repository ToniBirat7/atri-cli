name: Security Hygiene

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  policy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify policy docs exist
        run: |
          test -f SECURITY_POLICY.md
          test -f RELEASE_CHECKLIST.md

      - name: Validate release checklist sections
        run: |
          grep -q "Security" RELEASE_CHECKLIST.md
          grep -q "Rollback" RELEASE_CHECKLIST.md
          grep -q "CI" RELEASE_CHECKLIST.md
