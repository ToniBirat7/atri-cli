name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - 'apps/cli/**'
      - 'services/orchestrator/**'
      - '.github/workflows/release-readiness.yml'
      - 'RELEASE_CHECKLIST.md'
      - 'PLAN.md'
  pull_request:
    paths:
      - 'scripts/**'
      - 'apps/cli/**'
      - 'services/orchestrator/**'
      - '.github/workflows/release-readiness.yml'
      - 'RELEASE_CHECKLIST.md'
      - 'PLAN.md'

jobs:
  matrix-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh-install, first-run, restart, recovery]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orchestrator/requirements.txt -r apps/cli/requirements.txt

      - name: Run release-readiness scenario
        run: |
          python scripts/e2e/release_readiness_matrix.py --scenario "${{ matrix.scenario }}" --python "$(which python)"

      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-reports-${{ matrix.scenario }}
          path: benchmark_reports/phase6-*.json
          if-no-files-found: ignore

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orchestrator/requirements.txt -r apps/cli/requirements.txt

      - name: MCP readiness + slash/TUI smoke checks
        run: |
          PYTHONPATH='services/orchestrator:apps/cli:services/mcp' python -m pytest -q \
            services/orchestrator/tests/test_api.py \
            apps/cli/tests/test_main.py \
            apps/cli/tests/test_tui.py

  package-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build package channels
        run: |
          python scripts/package_cli_bundle.py

      - name: Verify bundled zipapp
        run: |
          python dist/atri-cli.pyz --help

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase6-package-artifacts
          path: |
            dist/atri-cli.pyz
            dist/atri-cli-installer.tar.gz
