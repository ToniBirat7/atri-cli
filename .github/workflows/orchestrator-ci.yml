name: Orchestrator CI

on:
  push:
    paths:
      - 'services/orchestrator/**'
      - '.github/workflows/orchestrator-ci.yml'
  pull_request:
    paths:
      - 'services/orchestrator/**'
      - '.github/workflows/orchestrator-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run orchestrator tests
        run: |
          python -m pytest tests/test_api.py tests/test_mcp_orchestrator.py tests/test_llm_adapter.py tests/test_integration.py -q
